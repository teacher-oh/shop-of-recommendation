name: Refresh product catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'collector/refresh-dummyjson.js'
      - '.github/workflows/collect-products.yml'
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh catalog from free APIs
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node collector/refresh-dummyjson.js
      - name: Commit catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json
          git diff --cached --quiet || git commit -m 'chore: refresh product catalog'
          git push
