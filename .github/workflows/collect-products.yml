name: Refresh product catalog

# Amazon Product Search is connected through the GitHub Actions secret
# AMAZON_RAPIDAPI_KEY. The collector runs automatically on this workflow.
on:
  workflow_dispatch:
    inputs:
      amazon_query:
        description: 'Amazon search query'
        required: false
        default: 'wireless headphones'
      amazon_country:
        description: 'Amazon marketplace country'
        required: false
        default: 'US'
      amazon_limit:
        description: 'Maximum Amazon products to import'
        required: false
        default: '10'
      amazon_host:
        description: 'RapidAPI host'
        required: false
        default: 'real-time-amazon-data.p.rapidapi.com'
  push:
    paths:
      - 'collector/refresh-dummyjson.js'
      - 'collector/mock-api.js'
      - 'collector/rapidapi-amazon.js'
      - '.github/workflows/collect-products.yml'
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh catalog from free APIs
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node collector/refresh-dummyjson.js

      - name: Refresh catalog from RapidAPI Amazon Product Search
        env:
          AMAZON_RAPIDAPI_KEY: ${{ secrets.AMAZON_RAPIDAPI_KEY }}
          AMAZON_API_HOST: ${{ inputs.amazon_host || 'real-time-amazon-data.p.rapidapi.com' }}
          AMAZON_SEARCH_QUERY: ${{ inputs.amazon_query || 'wireless headphones' }}
          AMAZON_COUNTRY: ${{ inputs.amazon_country || 'US' }}
          AMAZON_SEARCH_LIMIT: ${{ inputs.amazon_limit || '10' }}
        run: node collector/rapidapi-amazon.js

      - name: Generate mock supplier API
        run: node collector/mock-api.js

      - name: Commit catalog and mock API
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/mock-api/*.json
          git diff --cached --quiet || git commit -m 'chore: refresh product and marketplace data'
          git push
