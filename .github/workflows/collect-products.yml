name: Refresh product catalog

# Beta Amazon integration: Product Search + Product Details + Reviews + Offers.
# The API key stays in GitHub Actions secret AMAZON_RAPIDAPI_KEY.
on:
  workflow_dispatch:
    inputs:
      amazon_queries:
        description: 'Comma-separated Amazon beta search queries'
        required: false
        default: 'wireless headphones,wireless earbuds,laptop,smartphone,monitor,keyboard,mouse,air fryer,vacuum cleaner,running shoes,backpack,coffee maker'
      amazon_country:
        description: 'Amazon marketplace country'
        required: false
        default: 'US'
      amazon_pages:
        description: 'Search pages per query'
        required: false
        default: '2'
      amazon_max_products:
        description: 'Maximum unique Amazon products to import'
        required: false
        default: '200'
      amazon_details:
        description: 'Products receiving detailed product data'
        required: false
        default: '60'
      amazon_reviews:
        description: 'Products receiving review samples'
        required: false
        default: '20'
      amazon_review_pages:
        description: 'Review pages per sampled product'
        required: false
        default: '1'
      amazon_offers:
        description: 'Products receiving seller offer data'
        required: false
        default: '20'
      amazon_offer_page_limit:
        description: 'Maximum offers returned per offer request'
        required: false
        default: '50'
      amazon_host:
        description: 'RapidAPI host'
        required: false
        default: 'real-time-amazon-data.p.rapidapi.com'
  push:
    paths:
      - 'collector/refresh-dummyjson.js'
      - 'collector/mock-api.js'
      - 'collector/rapidapi-amazon.js'
      - '.github/workflows/collect-products.yml'
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh catalog from free APIs
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node collector/refresh-dummyjson.js

      - name: Refresh Amazon beta catalog
        env:
          AMAZON_RAPIDAPI_KEY: ${{ secrets.AMAZON_RAPIDAPI_KEY }}
          AMAZON_API_HOST: ${{ inputs.amazon_host || 'real-time-amazon-data.p.rapidapi.com' }}
          AMAZON_BETA_QUERIES: ${{ inputs.amazon_queries || 'wireless headphones,wireless earbuds,laptop,smartphone,monitor,keyboard,mouse,air fryer,vacuum cleaner,running shoes,backpack,coffee maker' }}
          AMAZON_COUNTRY: ${{ inputs.amazon_country || 'US' }}
          AMAZON_BETA_PAGES: ${{ inputs.amazon_pages || '2' }}
          AMAZON_BETA_MAX_PRODUCTS: ${{ inputs.amazon_max_products || '200' }}
          AMAZON_BETA_DETAILS: ${{ inputs.amazon_details || '60' }}
          AMAZON_BETA_REVIEWS: ${{ inputs.amazon_reviews || '20' }}
          AMAZON_BETA_REVIEW_PAGES: ${{ inputs.amazon_review_pages || '1' }}
          AMAZON_BETA_OFFERS: ${{ inputs.amazon_offers || '20' }}
          AMAZON_BETA_OFFER_PAGE_LIMIT: ${{ inputs.amazon_offer_page_limit || '50' }}
        run: node collector/rapidapi-amazon.js

      - name: Generate mock supplier API
        run: node collector/mock-api.js

      - name: Commit catalog and beta API data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/amazon-beta.json data/mock-api/*.json
          git diff --cached --quiet || git commit -m 'chore: refresh product and marketplace data'
          git push
