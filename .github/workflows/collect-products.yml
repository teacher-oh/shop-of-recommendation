name: Refresh product catalog

# Two Amazon sources are collected independently and merged into the catalog:
# 1) Axesso Amazon Data Service
# 2) RapidAPI Real-Time Amazon Data
# Secrets are passed only through GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      amazon_queries:
        description: 'Comma-separated Amazon search queries'
        required: false
        default: 'wireless headphones,wireless earbuds,laptop,smartphone,monitor,keyboard,mouse,air fryer,vacuum cleaner,running shoes,backpack,coffee maker'
      amazon_country:
        description: 'Amazon marketplace country'
        required: false
        default: 'US'
      amazon_pages:
        description: 'Search pages per query'
        required: false
        default: '2'
      amazon_max_products:
        description: 'Maximum unique Amazon products to collect per source'
        required: false
        default: '100'
      amazon_details:
        description: 'Maximum products to enrich with Axesso details'
        required: false
        default: '50'
      amazon_host:
        description: 'Axesso RapidAPI host'
        required: false
        default: 'axesso-amazon-data-service1.p.rapidapi.com'
      realtime_pages:
        description: 'Real-Time Amazon Data search pages per query'
        required: false
        default: '2'
      realtime_max_products:
        description: 'Maximum Real-Time Amazon Data products'
        required: false
        default: '100'
      realtime_details:
        description: 'Maximum Real-Time Amazon Data detail enrichments'
        required: false
        default: '30'
      realtime_reviews:
        description: 'Maximum Real-Time Amazon Data review samples'
        required: false
        default: '20'
      realtime_offers:
        description: 'Maximum Real-Time Amazon Data offer enrichments'
        required: false
        default: '20'
  push:
    paths:
      - 'collector/refresh-dummyjson.js'
      - 'collector/mock-api.js'
      - 'collector/axesso-amazon.js'
      - 'collector/rapidapi-amazon.js'
      - '.github/workflows/collect-products.yml'
  schedule:
    - cron: '17 18 * * 1'

permissions:
  contents: write

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh catalog from free APIs
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: node collector/refresh-dummyjson.js

      - name: Refresh Amazon catalog with Axesso
        env:
          AXESSO_RAPIDAPI_KEY: ${{ secrets.AXESSO_RAPIDAPI_KEY }}
          AXESSO_API_HOST: ${{ inputs.amazon_host || 'axesso-amazon-data-service1.p.rapidapi.com' }}
          AXESSO_BETA_QUERIES: ${{ inputs.amazon_queries || 'wireless headphones,wireless earbuds,laptop,smartphone,monitor,keyboard,mouse,air fryer,vacuum cleaner,running shoes,backpack,coffee maker' }}
          AXESSO_COUNTRY: ${{ inputs.amazon_country || 'US' }}
          AXESSO_DOMAIN: 'com'
          AXESSO_BETA_PAGES: ${{ inputs.amazon_pages || '2' }}
          AXESSO_BETA_MAX_PRODUCTS: ${{ inputs.amazon_max_products || '100' }}
          AXESSO_BETA_DETAILS: ${{ inputs.amazon_details || '50' }}
        run: node collector/axesso-amazon.js

      - name: Refresh Amazon catalog with Real-Time Amazon Data
        continue-on-error: true
        env:
          AMAZON_RAPIDAPI_KEY: ${{ secrets.AMAZON_RAPIDAPI_KEY }}
          AMAZON_API_HOST: ${{ secrets.AMAZON_API_HOST || 'real-time-amazon-data.p.rapidapi.com' }}
          AMAZON_BETA_QUERIES: ${{ inputs.amazon_queries || 'wireless headphones,wireless earbuds,laptop,smartphone,monitor,keyboard,mouse,air fryer,vacuum cleaner,running shoes,backpack,coffee maker' }}
          AMAZON_COUNTRY: ${{ inputs.amazon_country || 'US' }}
          AMAZON_BETA_PAGES: ${{ inputs.realtime_pages || '2' }}
          AMAZON_BETA_MAX_PRODUCTS: ${{ inputs.realtime_max_products || '100' }}
          AMAZON_BETA_DETAILS: ${{ inputs.realtime_details || '30' }}
          AMAZON_BETA_REVIEWS: ${{ inputs.realtime_reviews || '20' }}
          AMAZON_BETA_OFFERS: ${{ inputs.realtime_offers || '20' }}
          AMAZON_BETA_REVIEW_PAGES: '1'
          AMAZON_BETA_OFFER_PAGE_LIMIT: '50'
          AMAZON_BETA_DELAY_MS: '500'
        run: node collector/rapidapi-amazon.js

      - name: Generate mock supplier API
        run: node collector/mock-api.js

      - name: Commit catalog and Amazon API data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/products.json data/amazon-beta.json data/mock-api/*.json
          git diff --cached --quiet || git commit -m 'chore: refresh product and marketplace data'
          git push
